# ===============================
# Application
# ===============================
spring.application.name=clinicadmin
server.port=8080

# ===============================
# Eureka
# ===============================
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.healthcheck.enabled=false
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/

eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90

# ===============================
# MongoDB
# ===============================
# NOTE: the timeout/pool params below are also baked into
# SPRING_DATA_MONGODB_URI in docker-compose.yml (the env var takes
# precedence over this default when both are present). This local
# default is kept in sync so the service also behaves correctly when
# run outside Docker (e.g. straight from an IDE against local Mongo).
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://mongodb:27017/clinicadminservice?connectTimeoutMS=10000&socketTimeoutMS=30000&serverSelectionTimeoutMS=10000&maxPoolSize=20&minPoolSize=5}

# ===============================
# Server Timeouts
# ===============================
server.tomcat.connection-timeout=60s
spring.mvc.async.request-timeout=60000

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
# Surfaces Mongo connectivity specifically in /actuator/health, so a Mongo
# timeout/outage shows up there distinctly instead of only being visible
# as a generic 500 on unrelated endpoints like patient-analytics.
management.health.mongo.enabled=true

# ===============================
# Mail Configuration
# ===============================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.protocol=smtp

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.debug=false

# ===============================
# Resilience4j
# ===============================
spring.cloud.circuitbreaker.resilience4j.enabled=true

resilience4j.circuitbreaker.instances.serviceCircuitBreaker.register-health-indicator=true
resilience4j.circuitbreaker.instances.serviceCircuitBreaker.sliding-window-size=5
resilience4j.circuitbreaker.instances.serviceCircuitBreaker.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.serviceCircuitBreaker.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.serviceCircuitBreaker.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.serviceCircuitBreaker.failure-rate-threshold=50

# ===============================
# AWS S3
# ===============================
aws.access-key=${AWS_ACCESS_KEY_ID}
aws.secret-key=${AWS_SECRET_ACCESS_KEY}
aws.region=ap-south-1
aws.s3.bucket=physiocare-prod-storage

# ===============================
# Firebase
# ===============================
app.firebase-configuration-file=firebase-key.json

# ===============================
# WhatsApp
# ===============================
whatsapp.base-url=${WHATSAPP_BASE_URL}
whatsapp.auth-key=${WHATSAPP_AUTH_KEY}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID}
whatsapp.single-user-notification-template-id=${WHATSAPP_SINGLE_USER_NOTIFICATION_TEMPLATE_ID}

# ===============================
# Logging
# ===============================
logging.level.org.springframework.web=INFO
logging.level.com.clinicadmin=DEBUG
# Surfaces Mongo driver connection/pool events at DEBUG so a repeat of the
# server-selection timeout shows pool state (checked-out connections,
# wait queue) leading up to the failure, not just the final exception.
logging.level.org.mongodb.driver=INFO
logging.level.org.mongodb.driver.connection=DEBUG

# ===============================
# OpenFeign Timeouts
# ===============================
# Trimmed from 30000/60000 -- 60s read timeouts on inter-service calls
# (e.g. clinicadmin -> adminservice for clinic hours in patient-analytics)
# mean a stuck downstream call blocks the calling thread for a full
# minute, tying up a Tomcat worker thread the whole time. 10s connect /
# 30s read is still generous for calls between services on the same
# Docker network.
spring.cloud.openfeign.client.config.default.connectTimeout=10000
spring.cloud.openfeign.client.config.default.readTimeout=30000