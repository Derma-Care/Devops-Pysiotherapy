# ===============================
# Application
# ===============================
spring.application.name=clinicadmin
server.port=8080

# ===============================
# Eureka (production stability)
# ===============================
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.client.healthcheck.enabled=true
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=60
eureka.instance.lease-expiration-duration-in-seconds=180

# ===============================
# MongoDB (externalized for prod)
# ===============================
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

# ===============================
# Server Timeouts
# ===============================
server.tomcat.connection-timeout=20s
spring.mvc.async.request-timeout=30000

# ===============================
# Actuator (prod monitoring)
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false

# ===============================
# Mail Configuration (secrets injected)
# ===============================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.debug=false

# ===============================
# Resilience4j (stricter thresholds for prod)
# ===============================
spring.cloud.circuitbreaker.resilience4j.enabled=true
resilience4j.circuitbreaker.instances.serviceCircuitBreaker.register-health-indicator=true
resilience4j.circuitbreaker.instances.serviceCircuitBreaker.sliding-window-size=10
resilience4j.circuitbreaker.instances.serviceCircuitBreaker.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.serviceCircuitBreaker.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.serviceCircuitBreaker.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.serviceCircuitBreaker.failure-rate-threshold=50

# ===============================
# AWS S3 (prod bucket, secrets injected)
# ===============================
aws.access-key=${AWS_ACCESS_KEY_ID}
aws.secret-key=${AWS_SECRET_ACCESS_KEY}
aws.region=ap-south-1
aws.s3.bucket=physiocare-prod-storage

# ===============================
# Firebase (prod key)
# ===============================
app.firebase-configuration-file=firebase-key.json

# ===============================
# WhatsApp (secrets injected)
# ===============================
whatsapp.base-url=${WHATSAPP_BASE_URL}
whatsapp.auth-key=${WHATSAPP_AUTH_KEY}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID}
whatsapp.single-user-notification-template-id=${WHATSAPP_SINGLE_USER_NOTIFICATION_TEMPLATE_ID}

# ===============================
# Logging (INFO for prod)
# ===============================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.com.clinicadmin=INFO

# ===============================
# OpenFeign Timeouts (tightened for prod)
# ===============================
spring.cloud.openfeign.client.config.default.connectTimeout=3000
spring.cloud.openfeign.client.config.default.readTimeout=8000
spring.cloud.openfeign.client.config.default.loggerLevel=BASIC
