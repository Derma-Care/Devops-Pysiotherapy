spring:
  application:
    name: customerservice

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://mongodb:27017/customerService}

  mvc:
    async:
      request-timeout: 15000

  cloud:
    openfeign:
      client:
        config:
          default:
            # Tightened from 30000/60000. Internal service-to-service calls on the
            # same docker network should return in low seconds, not up to a minute.
            # A hung downstream call no longer holds a customerservice request
            # thread (and its stack + in-flight objects) for up to 60s.
            connectTimeout: 3000
            readTimeout: 8000

server:
  port: 8083

  servlet:
    context-path: /api

  tomcat:
    connection-timeout: 20s

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true

    healthcheck:
      enabled: true

    service-url:
      defaultZone: http://eureka-server:8761/eureka/

  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90

# ===============================
# Resilience4j
# ===============================
resilience4j:
  circuitbreaker:
    instances:
      circuitBreaker:
        failure-rate-threshold: 80
        sliding-window-size: 10
        sliding-window-type: COUNT_BASED
        minimum-number-of-calls: 5
        automatic-transition-from-open-to-half-open-enabled: true
        permitted-number-of-calls-in-half-open-state: 4
        wait-duration-in-open-state: 1m

# ===============================
# Actuator
# ===============================
management:
  server:
    base-path: /

  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

# ===============================
# AWS S3
# ===============================
aws:
  accessKeyId: ${AWS_ACCESS_KEY_ID}
  secretAccessKey: ${AWS_SECRET_ACCESS_KEY}
  region: ap-south-1
  s3:
    bucket: physiocare-prod-storage

# ===============================
# Firebase
# ===============================
app:
  firebase-configuration-file: firebase-key.json

# ===============================
# Logging
# ===============================
# NOTE: previously "com.sureCare.CustomerService", which does not match the
# actual base package "com.dermaCare.customerService" and was silently
# doing nothing. Fixed so DEBUG actually applies to this service's code.
logging:
  level:
    org.springframework.web: INFO
    com.dermaCare.customerService: DEBUG
