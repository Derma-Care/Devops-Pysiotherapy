        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=70.0
        -XX:InitialRAMPercentage=50.0
        -XX:MaxMetaspaceSize=128m
        -XX:+ExitOnOutOfMemoryError
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/tmp/heapdump.hprof
      SPRING_APPLICATION_NAME: bookingservice
      SPRING_DATA_MONGODB_URI: mongodb://booking_svc_user:${MONGO_APP_PASSWORD}@mongodb:27017/customerAppointments?authSource=customerAppointments&connectTimeoutMS=10000&socketTimeoutMS=30000&serverSelectionTimeoutMS=10000&maxPoolSize=20&minPoolSize=5
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      WHATSAPP_BASE_URL: ${WHATSAPP_BASE_URL}
      WHATSAPP_AUTH_KEY: ${WHATSAPP_AUTH_KEY}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_BOOKING_CONFIRMATION_TEMPLATE_ID: ${WHATSAPP_BOOKING_CONFIRMATION_TEMPLATE_ID}

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9900 > /dev/null || exit 0"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

    deploy:
      resources:
        limits:
          memory: 640m
        reservations:
          memory: 320m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - app-network

  # =========================================================
  # NOTIFICATION SERVICE
  # =========================================================
  # Was measured at ~79.54% real usage. Bumped 512m -> 640m. Also fixed
  # MaxMetaspaceSize, which was inconsistently set to 96m here vs 128m
  # everywhere else -- standardized to 128m so metaspace headroom is
  # uniform across all Java services.
  notification-service:
