# =========================================================
# NOTE ON MEMORY LIMITS
# =========================================================
# Every service below uses the top-level `mem_limit` / `mem_reservation`
# keys instead of `deploy.resources.limits/reservations`. The `deploy:`
# block is part of the Swarm spec and is SILENTLY IGNORED by plain
# `docker compose up` / `docker-compose up` (non-swarm) unless you pass
# `--compatibility`. That silent no-op was the root cause behind
# customerservice appearing to run unconstrained (jcmd showed a ~2GB
# G1 heap even though the file said 768m) -- the JVM's
# -XX:MaxRAMPercentage was computing against the *host's* total RAM,
# not a cgroup limit, because no cgroup limit was actually being set.
# `mem_limit` / `mem_reservation` map directly to `docker run
# --memory` / `--memory-reservation` and are honored by both the
# legacy `docker-compose` binary and the `docker compose` v2 plugin,
# with or without swarm. Verify after deploying with:
#   docker inspect <container> --format='{{.HostConfig.Memory}}'
# (should be a nonzero byte count matching the mem_limit below).
# =========================================================

services:

  # =========================================================
  # MONGODB
  # =========================================================
  mongodb:
    image: mongo:6.0
    container_name: mongodb_service
    restart: always
    stop_grace_period: 30s

    command: >
      mongod
      --wiredTigerCacheSizeGB 1
      --setParameter maxTransactionLockRequestTimeoutMillis=10000

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db
      - ./mongodb/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}

    healthcheck:
      test: ["CMD", "mongosh",
             "-u", "${MONGO_ROOT_USERNAME}",
             "-p", "${MONGO_ROOT_PASSWORD}",
             "--authenticationDatabase", "admin",
             "--eval", "db.adminCommand('ping')"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

    mem_limit: 1536m
    mem_reservation: 512m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - app-network

  # =========================================================
  # EUREKA SERVER
  # =========================================================
  # 512m limit was measured at ~60% real usage under load -> kept as-is,
  # comfortable headroom. Added -XX:+ExitOnOutOfMemoryError +
  # -XX:+HeapDumpOnOutOfMemoryError to every JVM service below so that if
  # a service DOES genuinely exhaust heap (as opposed to being cgroup
  # SIGKILL'd from outside), it dies loudly with a heap dump instead of
  # silently restarting with no trace in the app logs -- which is exactly
  # what made the customerservice incident hard to diagnose from
  # `docker logs | grep OutOfMemoryError` alone (a cgroup OOM-kill is a
  # SIGKILL from the kernel; the JVM never gets to log anything).
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile

    container_name: eureka_service
    restart: always
    stop_grace_period: 30s
    stop_signal: SIGKILL

    ports:
      - "8761:8761"

    environment:
      JAVA_TOOL_OPTIONS: >
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=70.0
        -XX:InitialRAMPercentage=50.0
        -XX:MaxMetaspaceSize=128m
        -XX:+ExitOnOutOfMemoryError
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/tmp/heapdump.hprof

    depends_on:
      mongodb:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

    mem_limit: 512m
    mem_reservation: 256m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - app-network

  # =========================================================
  # API GATEWAY
  # =========================================================
  # Measured ~55% real usage -> kept at 512m, comfortable headroom.
  apigateway:
    build:
      context: ./apigateway
      dockerfile: Dockerfile

    container_name: apigateway_service
    restart: always
    stop_grace_period: 30s
    stop_signal: SIGKILL

    ports:
      - "9090:9090"

    depends_on:
      eureka-server:
        condition: service_healthy

    environment:
      JAVA_TOOL_OPTIONS: >
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=70.0
        -XX:InitialRAMPercentage=50.0
        -XX:MaxMetaspaceSize=128m
        -XX:+ExitOnOutOfMemoryError
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/tmp/heapdump.hprof
      SPRING_APPLICATION_NAME: apigateway
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CLOUD_GATEWAY_HTTPCLIENT_CONNECT_TIMEOUT: 30000
      SPRING_CLOUD_GATEWAY_HTTPCLIENT_RESPONSE_TIMEOUT: 60s

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

    mem_limit: 512m
    mem_reservation: 256m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - app-network

  # =========================================================
  # ADMIN SERVICE
  # =========================================================
  # Was measured at ~75% real usage under load. Bumped 512m -> 640m to
  # give real headroom above steady-state instead of running at the
  # ceiling, same class of risk that caused the customerservice OOM-kill.
  adminservice:
    build:
      context: ./adminservice
      dockerfile: Dockerfile

    container_name: admin_service
    restart: always
    stop_grace_period: 30s
    stop_signal: SIGKILL

    ports:
      - "8081:8081"

    depends_on:
      mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

    environment:
      JAVA_TOOL_OPTIONS: >
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=70.0
        -XX:InitialRAMPercentage=50.0
        -XX:MaxMetaspaceSize=128m
        -XX:+ExitOnOutOfMemoryError
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/tmp/heapdump.hprof
      SPRING_APPLICATION_NAME: adminservice
      SPRING_DATA_MONGODB_URI: mongodb://admin_svc_user:${MONGO_APP_PASSWORD}@mongodb:27017/AdminService?authSource=AdminService&connectTimeoutMS=10000&socketTimeoutMS=30000&serverSelectionTimeoutMS=10000&maxPoolSize=20&minPoolSize=5
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_DEFAULT_CONNECTTIMEOUT: 10000
      SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_DEFAULT_READTIMEOUT: 30000
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

    mem_limit: 640m
    mem_reservation: 320m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - app-network

  # =========================================================
  # CLINIC ADMIN SERVICE
  # =========================================================
  # Was measured at ~82% real usage. Also carries the AWS SDK (S3) and
  # WhatsApp HTTP client, both of which add off-heap buffer overhead on
  # top of the JVM heap. Bumped 512m -> 768m.
  clinicadmin:
    build:
      context: ./clinicadmin
      dockerfile: Dockerfile

    container_name: clinicadmin_service
    restart: always
    stop_grace_period: 30s
    stop_signal: SIGKILL

    ports:
      - "8080:8080"

    depends_on:
      mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

    environment:
      JAVA_TOOL_OPTIONS: >
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=70.0
        -XX:InitialRAMPercentage=50.0
        -XX:MaxMetaspaceSize=128m
        -XX:+ExitOnOutOfMemoryError
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/tmp/heapdump.hprof
      SPRING_APPLICATION_NAME: clinicadmin
      SPRING_DATA_MONGODB_URI: mongodb://clinicadmin_svc_user:${MONGO_APP_PASSWORD}@mongodb:27017/clinicadminservice?authSource=clinicadminservice&connectTimeoutMS=10000&socketTimeoutMS=30000&serverSelectionTimeoutMS=10000&maxPoolSize=20&minPoolSize=5
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_DEFAULT_CONNECTTIMEOUT: 10000
      SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_DEFAULT_READTIMEOUT: 30000
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      WHATSAPP_BASE_URL: ${WHATSAPP_BASE_URL}
      WHATSAPP_AUTH_KEY: ${WHATSAPP_AUTH_KEY}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_SINGLE_USER_NOTIFICATION_TEMPLATE_ID: ${WHATSAPP_SINGLE_USER_NOTIFICATION_TEMPLATE_ID}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

    mem_limit: 768m
    mem_reservation: 384m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - app-network

  # =========================================================
  # PHYSIOTHERAPY DOCTOR SERVICE
  # =========================================================
  # Was measured at ~85.66% real usage -- the second-tightest service
  # after customerservice, and also the highest CPU user (1.17%),
  # suggesting real sustained load. Bumped 512m -> 768m.
  physiotherapydoctor-service:
    build:
      context: ./physiotherapydoctor-service
      dockerfile: Dockerfile

    container_name: physiotherapydoctor_service
    restart: always
    stop_grace_period: 30s
    stop_signal: SIGKILL

    ports:
      - "8888:8888"

    depends_on:
      mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

    environment:
      JAVA_TOOL_OPTIONS: >
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=70.0
        -XX:InitialRAMPercentage=50.0
        -XX:MaxMetaspaceSize=128m
        -XX:+ExitOnOutOfMemoryError
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/tmp/heapdump.hprof
      SPRING_APPLICATION_NAME: physiotherapydoctor-service
      SPRING_DATA_MONGODB_URI: mongodb://physio_svc_user:${MONGO_APP_PASSWORD}@mongodb:27017/physiotherapydoctorservice?authSource=physiotherapydoctorservice&connectTimeoutMS=10000&socketTimeoutMS=30000&serverSelectionTimeoutMS=10000&maxPoolSize=20&minPoolSize=5
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      WHATSAPP_BASE_URL: ${WHATSAPP_BASE_URL}
      WHATSAPP_AUTH_KEY: ${WHATSAPP_AUTH_KEY}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_PAYMENT_CONFIRMATION_TEMPLATE_ID: ${WHATSAPP_PAYMENT_CONFIRMATION_TEMPLATE_ID}
      WHATSAPP_FOLLOWUP_REMINDER_TEMPLATE_ID: ${WHATSAPP_FOLLOWUP_REMINDER_TEMPLATE_ID}

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8888 > /dev/null || exit 0"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

    mem_limit: 768m
    mem_reservation: 384m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - app-network

  # =========================================================
  # CUSTOMER SERVICE
  # =========================================================
  # UPDATE: added G1 periodic-GC flags. Root cause investigation showed
  # committed heap was NOT being released back to the OS after G1 grew it
  # during a load spike -- `docker stats` reports committed RSS, not live
  # usage, so the container looked permanently "full" even at idle with
  # zero API traffic. These flags make G1 run a low-priority cycle every
  # 60s specifically to uncommit unused pages when idle. This does not
  # change behavior under real load -- heap will still grow as needed via
  # MaxRAMPercentage; it only affects what happens AFTER load subsides.
  # Verify with: docker exec -it customer_service jcmd 1 GC.heap_info
  customerservice:
    build:
      context: ./customerservice
      dockerfile: Dockerfile

    container_name: customer_service
    restart: always
    stop_grace_period: 30s
    stop_signal: SIGKILL

    ports:
      - "8083:8083"

    depends_on:
      mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

    environment:
      JAVA_TOOL_OPTIONS: >
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=70.0
        -XX:InitialRAMPercentage=25.0
        -XX:MaxMetaspaceSize=128m
        -XX:+ExitOnOutOfMemoryError
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/tmp/heapdump.hprof
        -XX:G1PeriodicGCInterval=60000
        -XX:+G1PeriodicGCInvokesConcurrent
        -XX:G1PeriodicGCSystemLoadThreshold=0
      SPRING_APPLICATION_NAME: customerservice
      SPRING_DATA_MONGODB_URI: mongodb://customer_svc_user:${MONGO_APP_PASSWORD}@mongodb:27017/customerService?authSource=customerService&connectTimeoutMS=10000&socketTimeoutMS=30000&serverSelectionTimeoutMS=10000&maxPoolSize=20&minPoolSize=5
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_DEFAULT_CONNECTTIMEOUT: 3000
      SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_DEFAULT_READTIMEOUT: 8000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083 > /dev/null || exit 0"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

    mem_limit: 768m
    mem_reservation: 384m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - app-network

  # =========================================================
  # BOOKING SERVICE
  # =========================================================
  # Was measured at ~77% real usage. Bumped 512m -> 640m for headroom.
  bookingservice:
    build:
      context: ./bookingservice
      dockerfile: Dockerfile

    container_name: booking_service
    restart: always
    stop_grace_period: 30s
    stop_signal: SIGKILL

    ports:
      - "9900:9900"

    depends_on:
      mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

    environment:
      JAVA_TOOL_OPTIONS: >
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=70.0
        -XX:InitialRAMPercentage=50.0
        -XX:MaxMetaspaceSize=128m
        -XX:+ExitOnOutOfMemoryError
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/tmp/heapdump.hprof
      SPRING_APPLICATION_NAME: bookingservice
      SPRING_DATA_MONGODB_URI: mongodb://booking_svc_user:${MONGO_APP_PASSWORD}@mongodb:27017/customerAppointments?authSource=customerAppointments&connectTimeoutMS=10000&socketTimeoutMS=30000&serverSelectionTimeoutMS=10000&maxPoolSize=20&minPoolSize=5
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      WHATSAPP_BASE_URL: ${WHATSAPP_BASE_URL}
      WHATSAPP_AUTH_KEY: ${WHATSAPP_AUTH_KEY}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_BOOKING_CONFIRMATION_TEMPLATE_ID: ${WHATSAPP_BOOKING_CONFIRMATION_TEMPLATE_ID}

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9900 > /dev/null || exit 0"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

    mem_limit: 640m
    mem_reservation: 320m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - app-network

  # =========================================================
  # NOTIFICATION SERVICE
  # =========================================================
  # Was measured at ~79.54% real usage. Bumped 512m -> 640m. Also fixed
  # MaxMetaspaceSize, which was inconsistently set to 96m here vs 128m
  # everywhere else -- standardized to 128m so metaspace headroom is
  # uniform across all Java services.
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile

    container_name: notification_service
    restart: always
    stop_grace_period: 30s
    stop_signal: SIGKILL

    ports:
      - "9909:9909"

    depends_on:
      mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

    environment:
      JAVA_TOOL_OPTIONS: >
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=70.0
        -XX:InitialRAMPercentage=50.0
        -XX:MaxMetaspaceSize=128m
        -XX:+ExitOnOutOfMemoryError
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/tmp/heapdump.hprof
      SPRING_APPLICATION_NAME: notification-service
      SPRING_DATA_MONGODB_URI: mongodb://notification_svc_user:${MONGO_APP_PASSWORD}@mongodb:27017/DermaCareNotifications?authSource=DermaCareNotifications&connectTimeoutMS=10000&socketTimeoutMS=30000&serverSelectionTimeoutMS=10000&maxPoolSize=20&minPoolSize=5
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9909 > /dev/null || exit 0"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

    mem_limit: 640m
    mem_reservation: 320m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - app-network

  # =========================================================
  # FRONTEND - CLINIC ADMIN
  # =========================================================
  # Static nginx frontends were measured at 2-4% usage -- left untouched.
  clinic-admin-web:
    build:
      context: ./clinic-admin-web
      dockerfile: Dockerfile

    container_name: clinic-admin-web-container
    restart: always
    stop_grace_period: 10s

    ports:
      - "3000:80"

    depends_on:
      apigateway:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
