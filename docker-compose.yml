      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - app-network

  # =========================================================
  # FRONTEND - MAIN ADMIN
  # =========================================================
  main-admin-web:
    build:
      context: ./main-admin-web
      dockerfile: Dockerfile

    container_name: main-admin-web-container
    restart: always
    stop_grace_period: 10s

