services:

  # =========================================================
  # MONGODB
  # =========================================================
  mongodb:
    image: mongo:6.0
    container_name: mongodb_service
    restart: always
    stop_grace_period: 30s
    command: >
      mongod
      --wiredTigerCacheSizeGB 1
      --setParameter maxTransactionLockRequestTimeoutMillis=10000
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongodb/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    healthcheck:
      test: ["CMD", "mongosh",
             "-u", "${MONGO_ROOT_USERNAME}",
             "-p", "${MONGO_ROOT_PASSWORD}",
             "--authenticationDatabase", "admin",
             "--eval", "db.adminCommand('ping')"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1536m
    networks:
      - app-network

  # =========================================================
  # EUREKA SERVER
  # =========================================================
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka_service
    restart: always
    ports:
      - "8761:8761"
    environment:
      JAVA_TOOL_OPTIONS: >
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=70.0
        -XX:InitialRAMPercentage=50.0
        -XX:MaxMetaspaceSize=256m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 768m
    networks:
      - app-network

  # =========================================================
  # API GATEWAY
  # =========================================================
  apigateway:
    build:
      context: ./apigateway
      dockerfile: Dockerfile
    container_name: apigateway_service
    restart: always
    ports:
      - "9090:9090"
    environment:
      JAVA_TOOL_OPTIONS: >
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=70.0
        -XX:InitialRAMPercentage=50.0
        -XX:MaxMetaspaceSize=256m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 768m
    networks:
      - app-network

