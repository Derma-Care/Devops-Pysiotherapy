    ports:
      - "8888:8888"

    depends_on:
      mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

    environment:
      JAVA_TOOL_OPTIONS: >
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=70.0
        -XX:InitialRAMPercentage=50.0
        -XX:MaxMetaspaceSize=128m
        -XX:+ExitOnOutOfMemoryError
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/tmp/heapdump.hprof
      SPRING_APPLICATION_NAME: physiotherapydoctor-service
      SPRING_DATA_MONGODB_URI: mongodb://physio_svc_user:${MONGO_APP_PASSWORD}@mongodb:27017/physiotherapydoctorservice?authSource=physiotherapydoctorservice&connectTimeoutMS=10000&socketTimeoutMS=30000&serverSelectionTimeoutMS=10000&maxPoolSize=20&minPoolSize=5
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      WHATSAPP_BASE_URL: ${WHATSAPP_BASE_URL}
      WHATSAPP_AUTH_KEY: ${WHATSAPP_AUTH_KEY}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_PAYMENT_CONFIRMATION_TEMPLATE_ID: ${WHATSAPP_PAYMENT_CONFIRMATION_TEMPLATE_ID}
      WHATSAPP_FOLLOWUP_REMINDER_TEMPLATE_ID: ${WHATSAPP_FOLLOWUP_REMINDER_TEMPLATE_ID}

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8888 > /dev/null || exit 0"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

    deploy:
      resources:
        limits:
          memory: 768m
        reservations:
          memory: 384m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - app-network

  # =========================================================
  # CUSTOMER SERVICE
  # =========================================================
  # ROOT CAUSE OF THE INCIDENT: this service was measured at 96.06%
  # (491.8MiB / 512MiB), the tightest of any service in the whole stack.
  # Under any load spike -- heap growth, GC pause, connection burst -- it
  # blew past the 512m cgroup limit and the kernel OOM-killer sent a
  # SIGKILL from outside the JVM. That's a hard kill: the JVM gets no
  # chance to log "OutOfMemoryError" anywhere, which is why grepping the
  # app logs for that string came back empty even though memory exhaustion
  # was the cause. `restart: always` then silently brought it back up
  # within seconds, producing the DOWN/UP flapping seen in Eureka.
  # FIX: bumped 512m -> 768m to bring real usage down to a safer ~65%
  # band, matching the other historically-tight services above. Also
  # added the ExitOnOutOfMemoryError/HeapDumpOnOutOfMemoryError flags so
  # that if it DOES exhaust heap again, it dies with an actual log line
  # and a heap dump in /tmp instead of vanishing silently.
  customerservice:
    build:
      context: ./customerservice
      dockerfile: Dockerfile

    container_name: customer_service
    restart: always
    stop_grace_period: 30s
    stop_signal: SIGKILL

    ports:
      - "8083:8083"

    depends_on:
      mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

    environment:
      JAVA_TOOL_OPTIONS: >
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=70.0
        -XX:InitialRAMPercentage=50.0
        -XX:MaxMetaspaceSize=128m
        -XX:+ExitOnOutOfMemoryError
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/tmp/heapdump.hprof
      SPRING_APPLICATION_NAME: customerservice
      SPRING_DATA_MONGODB_URI: mongodb://customer_svc_user:${MONGO_APP_PASSWORD}@mongodb:27017/customerService?authSource=customerService&connectTimeoutMS=10000&socketTimeoutMS=30000&serverSelectionTimeoutMS=10000&maxPoolSize=20&minPoolSize=5
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_DEFAULT_CONNECTTIMEOUT: 10000
      SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_DEFAULT_READTIMEOUT: 30000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083 > /dev/null || exit 0"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

    deploy:
      resources:
        limits:
          memory: 768m
        reservations:
          memory: 384m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - app-network

  # =========================================================
  # BOOKING SERVICE
  # =========================================================
