        condition: service_healthy

    environment:
      JAVA_TOOL_OPTIONS: >
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=60.0
        -XX:InitialRAMPercentage=30.0
        -XX:MaxMetaspaceSize=128m
        -XX:MaxDirectMemorySize=96m
        -XX:+ExitOnOutOfMemoryError
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/tmp/heapdump.hprof
      SPRING_APPLICATION_NAME: clinicadmin
      SPRING_DATA_MONGODB_URI: mongodb://clinicadmin_svc_user:${MONGO_APP_PASSWORD}@mongodb:27017/clinicadminservice?authSource=clinicadminservice&connectTimeoutMS=10000&socketTimeoutMS=30000&serverSelectionTimeoutMS=10000&maxPoolSize=20&minPoolSize=5
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_DEFAULT_CONNECTTIMEOUT: 10000
      SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_DEFAULT_READTIMEOUT: 30000
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      WHATSAPP_BASE_URL: ${WHATSAPP_BASE_URL}
      WHATSAPP_AUTH_KEY: ${WHATSAPP_AUTH_KEY}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_SINGLE_USER_NOTIFICATION_TEMPLATE_ID: ${WHATSAPP_SINGLE_USER_NOTIFICATION_TEMPLATE_ID}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

    mem_limit: 768m
    mem_reservation: 384m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - app-network

  # =========================================================
  # PHYSIOTHERAPY DOCTOR SERVICE
  # =========================================================
  physiotherapydoctor-service:
    build:
      context: ./physiotherapydoctor-service
      dockerfile: Dockerfile

    container_name: physiotherapydoctor_service
    restart: always
    stop_grace_period: 30s
    stop_signal: SIGKILL

    ports:
      - "8888:8888"

    depends_on:
      mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

    environment:
      JAVA_TOOL_OPTIONS: >
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=60.0
        -XX:InitialRAMPercentage=30.0
        -XX:MaxMetaspaceSize=128m
        -XX:MaxDirectMemorySize=96m
        -XX:+ExitOnOutOfMemoryError
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/tmp/heapdump.hprof
      SPRING_APPLICATION_NAME: physiotherapydoctor-service
      SPRING_DATA_MONGODB_URI: mongodb://physio_svc_user:${MONGO_APP_PASSWORD}@mongodb:27017/physiotherapydoctorservice?authSource=physiotherapydoctorservice&connectTimeoutMS=10000&socketTimeoutMS=30000&serverSelectionTimeoutMS=10000&maxPoolSize=20&minPoolSize=5
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      WHATSAPP_BASE_URL: ${WHATSAPP_BASE_URL}
      WHATSAPP_AUTH_KEY: ${WHATSAPP_AUTH_KEY}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_PAYMENT_CONFIRMATION_TEMPLATE_ID: ${WHATSAPP_PAYMENT_CONFIRMATION_TEMPLATE_ID}
      WHATSAPP_FOLLOWUP_REMINDER_TEMPLATE_ID: ${WHATSAPP_FOLLOWUP_REMINDER_TEMPLATE_ID}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

    mem_limit: 768m
    mem_reservation: 384m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - app-network

  # =========================================================
  # CUSTOMER SERVICE
  # =========================================================
  customerservice:
    build:
      context: ./customerservice
      dockerfile: Dockerfile

    container_name: customer_service
    restart: always
    stop_grace_period: 30s
    stop_signal: SIGKILL

    ports:
      - "8083:8083"

    depends_on:
      mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

    environment:
      JAVA_TOOL_OPTIONS: >
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=60.0
        -XX:InitialRAMPercentage=30.0
        -XX:MaxMetaspaceSize=128m
        -XX:MaxDirectMemorySize=96m
        -XX:+ExitOnOutOfMemoryError
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/tmp/heapdump.hprof
        -XX:G1PeriodicGCInterval=60000
        -XX:+G1PeriodicGCInvokesConcurrent
        -XX:G1PeriodicGCSystemLoadThreshold=0
      SPRING_APPLICATION_NAME: customerservice
      SPRING_DATA_MONGODB_URI: mongodb://customer_svc_user:${MONGO_APP_PASSWORD}@mongodb:27017/customerService?authSource=customerService&connectTimeoutMS=10000&socketTimeoutMS=30000&serverSelectionTimeoutMS=10000&maxPoolSize=20&minPoolSize=5
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_DEFAULT_CONNECTTIMEOUT: 3000
      SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_DEFAULT_READTIMEOUT: 8000
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/api/actuator/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

    mem_limit: 768m
    mem_reservation: 384m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - app-network

  # =========================================================
  # BOOKING SERVICE
  # =========================================================
  bookingservice:
    build:
      context: ./bookingservice
      dockerfile: Dockerfile

    container_name: booking_service
    restart: always
    stop_grace_period: 30s
    stop_signal: SIGKILL

    ports:
      - "9900:9900"

    depends_on:
      mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

    environment:
      JAVA_TOOL_OPTIONS: >
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=60.0
        -XX:InitialRAMPercentage=30.0
        -XX:MaxMetaspaceSize=128m
        -XX:MaxDirectMemorySize=96m
        -XX:+ExitOnOutOfMemoryError
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/tmp/heapdump.hprof
      SPRING_APPLICATION_NAME: bookingservice
      SPRING_DATA_MONGODB_URI: mongodb://booking_svc_user:${MONGO_APP_PASSWORD}@mongodb:27017/customerAppointments?authSource=customerAppointments&connectTimeoutMS=10000&socketTimeoutMS=30000&serverSelectionTimeoutMS=10000&maxPoolSize=20&minPoolSize=5
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      WHATSAPP_BASE_URL: ${WHATSAPP_BASE_URL}
      WHATSAPP_AUTH_KEY: ${WHATSAPP_AUTH_KEY}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_BOOKING_CONFIRMATION_TEMPLATE_ID: ${WHATSAPP_BOOKING_CONFIRMATION_TEMPLATE_ID}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9900/actuator/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

    mem_limit: 640m
    mem_reservation: 320m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - app-network

  # =========================================================
  # NOTIFICATION SERVICE
  # =========================================================
  # mem_limit raised 640m -> 768m and MaxDirectMemorySize added: this
  # service was observed at 95.83% memory usage (613MB/640MB) at idle,
  # traced to firebase-admin's gRPC/Netty stack allocating off-heap
  # buffers that MaxRAMPercentage alone doesn't account for.
  # VERIFY server.port and context-path before deploy -- see top-of-file
  # note; Dockerfile currently EXPOSEs 8089 while this maps 9909:9909.
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile

    container_name: notification_service
    restart: always
    stop_grace_period: 30s
    stop_signal: SIGKILL

    ports:
      - "9909:9909"

    depends_on:
      mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

    environment:
      JAVA_TOOL_OPTIONS: >
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=60.0
        -XX:InitialRAMPercentage=30.0
        -XX:MaxMetaspaceSize=128m
        -XX:MaxDirectMemorySize=128m
        -XX:+ExitOnOutOfMemoryError
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/tmp/heapdump.hprof
        -XX:G1PeriodicGCInterval=60000
        -XX:+G1PeriodicGCInvokesConcurrent
        -XX:G1PeriodicGCSystemLoadThreshold=0
      SPRING_APPLICATION_NAME: notification-service
      SPRING_DATA_MONGODB_URI: mongodb://notification_svc_user:${MONGO_APP_PASSWORD}@mongodb:27017/DermaCareNotifications?authSource=DermaCareNotifications&connectTimeoutMS=10000&socketTimeoutMS=30000&serverSelectionTimeoutMS=10000&maxPoolSize=20&minPoolSize=5
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9909/actuator/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

    mem_limit: 768m
    mem_reservation: 384m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - app-network

  # =========================================================
