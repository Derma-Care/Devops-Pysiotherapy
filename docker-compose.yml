services:

  # =========================================================
  # MONGODB
  # =========================================================

  mongodb:
    image: mongo:6.0
    container_name: mongodb_service
    restart: always
    stop_grace_period: 30s

    command: mongod --wiredTigerCacheSizeGB 0.25

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db
      - ./mongodb/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}

    healthcheck:
      test: ["CMD", "mongosh",
             "-u", "${MONGO_ROOT_USERNAME}",
             "-p", "${MONGO_ROOT_PASSWORD}",
             "--authenticationDatabase", "admin",
             "--eval", "db.adminCommand('ping')"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

    deploy:
      resources:
        limits:
          memory: 512m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - app-network

  # =========================================================
  # EUREKA SERVER
  # =========================================================

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile

    container_name: eureka_service
    restart: always
    stop_grace_period: 30s
    stop_signal: SIGKILL

    ports:
      - "8761:8761"

    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"

    depends_on:
      mongodb:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

    deploy:
      resources:
        limits:
          memory: 512m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - app-network

  # =========================================================
  # API GATEWAY
  # =========================================================

  apigateway:
    build:
      context: ./apigateway
      dockerfile: Dockerfile

    container_name: apigateway_service
    restart: always
    stop_grace_period: 30s
    stop_signal: SIGKILL

    ports:
      - "9090:9090"

    depends_on:
      eureka-server:
        condition: service_healthy

    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"
      SPRING_APPLICATION_NAME: apigateway
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CLOUD_GATEWAY_HTTPCLIENT_CONNECT_TIMEOUT: 30000
      SPRING_CLOUD_GATEWAY_HTTPCLIENT_RESPONSE_TIMEOUT: 60s

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

    deploy:
      resources:
        limits:
          memory: 512m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - app-network

  # =========================================================
  # ADMIN SERVICE
  # =========================================================

  adminservice:
    build:
      context: ./adminservice
      dockerfile: Dockerfile

    container_name: admin_service
    restart: always
    stop_grace_period: 30s
    stop_signal: SIGKILL

    ports:
      - "8081:8081"

    depends_on:
      mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"
      SPRING_APPLICATION_NAME: adminservice
      SPRING_DATA_MONGODB_URI: mongodb://admin_svc_user:${MONGO_APP_PASSWORD}@mongodb:27017/AdminService?authSource=AdminService&connectTimeoutMS=30000&socketTimeoutMS=60000
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_DEFAULT_CONNECTTIMEOUT: 30000
      SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_DEFAULT_READTIMEOUT: 60000
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

    deploy:
      resources:
        limits:
          memory: 512m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - app-network

