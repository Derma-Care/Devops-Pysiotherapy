        -XX:MaxMetaspaceSize=128m
        -XX:+ExitOnOutOfMemoryError
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/tmp/heapdump.hprof
      SPRING_APPLICATION_NAME: notification-service
      SPRING_DATA_MONGODB_URI: mongodb://notification_svc_user:${MONGO_APP_PASSWORD}@mongodb:27017/DermaCareNotifications?authSource=DermaCareNotifications&connectTimeoutMS=10000&socketTimeoutMS=30000&serverSelectionTimeoutMS=10000&maxPoolSize=20&minPoolSize=5
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9909 > /dev/null || exit 0"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

    deploy:
      resources:
        limits:
          memory: 640m
        reservations:
          memory: 320m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - app-network

  # =========================================================
  # FRONTEND - CLINIC ADMIN
  # =========================================================
  # Static nginx frontends were measured at 2-4% usage -- left untouched.
  clinic-admin-web:
    build:
      context: ./clinic-admin-web
