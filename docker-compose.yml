      SPRING_DATA_MONGODB_URI: mongodb://physio_svc_user:${MONGO_APP_PASSWORD}@mongodb:27017/physiotherapydoctorservice?authSource=physiotherapydoctorservice&connectTimeoutMS=30000&socketTimeoutMS=60000
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
        # ✅ ADD THIS
      WHATSAPP_BASE_URL: ${WHATSAPP_BASE_URL}
      WHATSAPP_AUTH_KEY: ${WHATSAPP_AUTH_KEY}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_PAYMENT_CONFIRMATION_TEMPLATE_ID: ${WHATSAPP_PAYMENT_CONFIRMATION_TEMPLATE_ID}

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8888 > /dev/null || exit 0"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

    deploy:
      resources:
        limits:
          memory: 512m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
