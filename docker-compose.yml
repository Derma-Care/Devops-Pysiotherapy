      SPRING_DATA_MONGODB_URI: "mongodb://${MONGO_USER}:${MONGO_PASS}@mongodb:27017/AdminService?authSource=admin&connectTimeoutMS=30000&socketTimeoutMS=60000"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_DEFAULT_CONNECTTIMEOUT: 30000
      SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_DEFAULT_READTIMEOUT: 60000
