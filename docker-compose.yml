# =========================================================
# NOTE ON MEMORY LIMITS
# =========================================================
# All services use top-level `mem_limit` / `mem_reservation` (maps to
# `docker run --memory` / `--memory-reservation`) instead of
# `deploy.resources.limits/reservations`, which is Swarm-only and
# silently ignored by plain `docker compose up`. Verify after deploy:
#   docker inspect <container> --format='{{.HostConfig.Memory}}'
#
# NOTE ON JVM TUNING (standardized this revision)
# =========================================================
# Every Java service now shares a common baseline:
#   -XX:+UseContainerSupport         -> respects cgroup limit, not host RAM
#   -XX:MaxRAMPercentage=60.0        -> heap ceiling, leaves headroom for
#                                        metaspace + direct memory + threads
#   -XX:InitialRAMPercentage=30.0
#   -XX:MaxMetaspaceSize=128m
#   -XX:MaxDirectMemorySize=<X>m     -> TAILORED per service below, caps
#                                        Netty/gRPC/NIO off-heap buffers
#                                        which MaxRAMPercentage does NOT cover
#   -XX:+ExitOnOutOfMemoryError / HeapDumpOnOutOfMemoryError -> fail fast,
#                                        leave a dump instead of hanging
#
# Periodic GC (G1PeriodicGCInterval=60000, InvokesConcurrent,
# SystemLoadThreshold=0) is added ONLY to services with idle off-heap
# footprints that were observed creeping in `docker stats`
# (notification-service, customerservice). It is deliberately NOT added
# to low-allocation services like eureka-server, where there's nothing
# meaningful to reclaim and it would just burn idle CPU cycles.
#
# MaxDirectMemorySize sizing rationale:
#   eureka-server            64m  - minimal off-heap usage, registry only
#   apigateway               128m - Spring Cloud Gateway is Netty/reactive,
#                                    genuinely needs off-heap buffer headroom
#   adminservice              64m - blocking Feign + JavaMail, light off-heap
#   clinicadmin                96m - AWS SDK (S3) + WhatsApp HTTP client
#   physiotherapydoctor-svc    96m - AWS SDK + WhatsApp HTTP client
#   customerservice            96m - AWS SDK + Feign
#   bookingservice              96m - AWS SDK + WhatsApp HTTP client
#   notification-service      128m - firebase-admin pulls gRPC+Netty, the
#                                     heaviest off-heap user in the stack
#
# NOTE ON HEALTHCHECKS
# =========================================================
# All healthchecks use `CMD curl -f` (fails on non-2xx), not
# `CMD-SHELL ... || exit 0` (which always "succeeds"). customerservice
# has server.servlet.context-path: /api confirmed in application.yml, so
# its actuator path is /api/actuator/health. bookingservice,
# notification-service, and physiotherapydoctor-service are ASSUMED to
# have no context-path -- verify against each service's application.yml
# before deploying, or the healthcheck will 404 and mark the container
# unhealthy despite the app working fine.
#
# NOTE ON notification-service PORT MISMATCH -- VERIFY BEFORE DEPLOY
# =========================================================
# This compose file maps 9909:9909 and healthchecks port 9909, but the
# service's Dockerfile has `EXPOSE 8089`. EXPOSE is documentation only
# and doesn't break anything by itself, but it strongly suggests
# server.port in notification-service's application.yml may not
# actually be 9909. If it isn't, the healthcheck will fail internally,
# Docker will keep the container marked unhealthy, and repeated restart
# attempts will themselves cause memory/CPU spikes. Confirm with:
#   grep server.port notification-service/src/main/resources/application*.yml
#   docker exec notification_service curl -sf http://localhost:9909/actuator/health
# before relying on this file as-is.
# =========================================================

services:

  # =========================================================
  # MONGODB
  # =========================================================
  mongodb:
    image: mongo:6.0
    container_name: mongodb_service
    restart: always
    stop_grace_period: 30s

    command: >
      mongod
      --wiredTigerCacheSizeGB 1
      --setParameter maxTransactionLockRequestTimeoutMillis=10000

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db
      - ./mongodb/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}

    healthcheck:
      test: ["CMD", "mongosh",
             "-u", "${MONGO_ROOT_USERNAME}",
             "-p", "${MONGO_ROOT_PASSWORD}",
             "--authenticationDatabase", "admin",
             "--eval", "db.adminCommand('ping')"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

    mem_limit: 1536m
    mem_reservation: 512m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - app-network

  # =========================================================
  # EUREKA SERVER
  # =========================================================
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile

    container_name: eureka_service
    restart: always
    stop_grace_period: 30s
    stop_signal: SIGKILL

    ports:
      - "8761:8761"

    environment:
      JAVA_TOOL_OPTIONS: >
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=60.0
        -XX:InitialRAMPercentage=30.0
        -XX:MaxMetaspaceSize=128m
        -XX:MaxDirectMemorySize=64m
        -XX:+ExitOnOutOfMemoryError
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/tmp/heapdump.hprof

    depends_on:
      mongodb:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

    mem_limit: 512m
    mem_reservation: 256m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - app-network

  # =========================================================
  # API GATEWAY
  # =========================================================
  apigateway:
    build:
      context: ./apigateway
      dockerfile: Dockerfile

    container_name: apigateway_service
    restart: always
    stop_grace_period: 30s
    stop_signal: SIGKILL

    ports:
      - "9090:9090"

    depends_on:
      eureka-server:
        condition: service_healthy

    environment:
      JAVA_TOOL_OPTIONS: >
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=60.0
        -XX:InitialRAMPercentage=30.0
        -XX:MaxMetaspaceSize=128m
        -XX:MaxDirectMemorySize=128m
        -XX:+ExitOnOutOfMemoryError
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/tmp/heapdump.hprof
      SPRING_APPLICATION_NAME: apigateway
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CLOUD_GATEWAY_HTTPCLIENT_CONNECT_TIMEOUT: 30000
      SPRING_CLOUD_GATEWAY_HTTPCLIENT_RESPONSE_TIMEOUT: 60s

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

    mem_limit: 512m
    mem_reservation: 256m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - app-network

  # =========================================================
  # ADMIN SERVICE
  # =========================================================
  adminservice:
    build:
      context: ./adminservice
      dockerfile: Dockerfile

    container_name: admin_service
    restart: always
    stop_grace_period: 30s
    stop_signal: SIGKILL

    ports:
      - "8081:8081"

    depends_on:
      mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

    environment:
      JAVA_TOOL_OPTIONS: >
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=60.0
        -XX:InitialRAMPercentage=30.0
        -XX:MaxMetaspaceSize=128m
        -XX:MaxDirectMemorySize=64m
        -XX:+ExitOnOutOfMemoryError
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/tmp/heapdump.hprof
      SPRING_APPLICATION_NAME: adminservice
      SPRING_DATA_MONGODB_URI: mongodb://admin_svc_user:${MONGO_APP_PASSWORD}@mongodb:27017/AdminService?authSource=AdminService&connectTimeoutMS=10000&socketTimeoutMS=30000&serverSelectionTimeoutMS=10000&maxPoolSize=20&minPoolSize=5
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_DEFAULT_CONNECTTIMEOUT: 10000
      SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_DEFAULT_READTIMEOUT: 30000
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

    mem_limit: 640m
    mem_reservation: 320m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - app-network

  # =========================================================
  # CLINIC ADMIN SERVICE
  # =========================================================
  clinicadmin:
    build:
      context: ./clinicadmin
      dockerfile: Dockerfile

    container_name: clinicadmin_service
    restart: always
    stop_grace_period: 30s
