services:

  # =========================================================
  # MONGODB
  # =========================================================
  mongodb:
    image: mongo:6.0
    container_name: mongodb_service
    restart: always
    stop_grace_period: 30s

    command: >
      mongod
      --wiredTigerCacheSizeGB 1
      --setParameter maxTransactionLockRequestTimeoutMillis=10000

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db
      - ./mongodb/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}

    healthcheck:
      test: ["CMD", "mongosh",
             "-u", "${MONGO_ROOT_USERNAME}",
             "-p", "${MONGO_ROOT_PASSWORD}",
             "--authenticationDatabase", "admin",
             "--eval", "db.adminCommand('ping')"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s

    deploy:
      resources:
        limits:
          memory: 1536m
        reservations:
          memory: 512m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - app-network

  # =========================================================
  # EUREKA SERVER
  # =========================================================
  # 512m limit was measured at ~60% real usage under load -> kept as-is,
  # comfortable headroom. Added -XX:+ExitOnOutOfMemoryError +
  # -XX:+HeapDumpOnOutOfMemoryError to every JVM service below so that if
  # a service DOES genuinely exhaust heap (as opposed to being cgroup
  # SIGKILL'd from outside), it dies loudly with a heap dump instead of
  # silently restarting with no trace in the app logs -- which is exactly
  # what made the customerservice incident hard to diagnose from
  # `docker logs | grep OutOfMemoryError` alone (a cgroup OOM-kill is a
  # SIGKILL from the kernel; the JVM never gets to log anything).
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile

    container_name: eureka_service
    restart: always
    stop_grace_period: 30s
    stop_signal: SIGKILL

    ports:
      - "8761:8761"

    environment:
      JAVA_TOOL_OPTIONS: >
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=70.0
        -XX:InitialRAMPercentage=50.0
        -XX:MaxMetaspaceSize=128m
        -XX:+ExitOnOutOfMemoryError
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/tmp/heapdump.hprof

    depends_on:
      mongodb:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - app-network

  # =========================================================
  # API GATEWAY
  # =========================================================
  # Measured ~55% real usage -> kept at 512m, comfortable headroom.
  apigateway:
    build:
      context: ./apigateway
      dockerfile: Dockerfile

    container_name: apigateway_service
    restart: always
    stop_grace_period: 30s
    stop_signal: SIGKILL

    ports:
      - "9090:9090"

    depends_on:
      eureka-server:
        condition: service_healthy

    environment:
      JAVA_TOOL_OPTIONS: >
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=70.0
        -XX:InitialRAMPercentage=50.0
        -XX:MaxMetaspaceSize=128m
        -XX:+ExitOnOutOfMemoryError
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/tmp/heapdump.hprof
      SPRING_APPLICATION_NAME: apigateway
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CLOUD_GATEWAY_HTTPCLIENT_CONNECT_TIMEOUT: 30000
      SPRING_CLOUD_GATEWAY_HTTPCLIENT_RESPONSE_TIMEOUT: 60s

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - app-network

  # =========================================================
  # ADMIN SERVICE
  # =========================================================
  # Was measured at ~75% real usage under load. Bumped 512m -> 640m to
  # give real headroom above steady-state instead of running at the
  # ceiling, same class of risk that caused the customerservice OOM-kill.
  adminservice:
    build:
      context: ./adminservice
      dockerfile: Dockerfile

    container_name: admin_service
    restart: always
    stop_grace_period: 30s
    stop_signal: SIGKILL

    ports:
      - "8081:8081"

    depends_on:
      mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

    environment:
      JAVA_TOOL_OPTIONS: >
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=70.0
        -XX:InitialRAMPercentage=50.0
        -XX:MaxMetaspaceSize=128m
        -XX:+ExitOnOutOfMemoryError
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/tmp/heapdump.hprof
      SPRING_APPLICATION_NAME: adminservice
      SPRING_DATA_MONGODB_URI: mongodb://admin_svc_user:${MONGO_APP_PASSWORD}@mongodb:27017/AdminService?authSource=AdminService&connectTimeoutMS=10000&socketTimeoutMS=30000&serverSelectionTimeoutMS=10000&maxPoolSize=20&minPoolSize=5
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_DEFAULT_CONNECTTIMEOUT: 10000
      SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_DEFAULT_READTIMEOUT: 30000
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

    deploy:
      resources:
        limits:
          memory: 640m
        reservations:
          memory: 320m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - app-network

  # =========================================================
  # CLINIC ADMIN SERVICE
  # =========================================================
  # Was measured at ~82% real usage. Also carries the AWS SDK (S3) and
  # WhatsApp HTTP client, both of which add off-heap buffer overhead on
  # top of the JVM heap. Bumped 512m -> 768m.
  clinicadmin:
    build:
      context: ./clinicadmin
      dockerfile: Dockerfile

    container_name: clinicadmin_service
    restart: always
    stop_grace_period: 30s
    stop_signal: SIGKILL

    ports:
      - "8080:8080"

    depends_on:
      mongodb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

    environment:
      JAVA_TOOL_OPTIONS: >
        -XX:+UseContainerSupport
        -XX:MaxRAMPercentage=70.0
        -XX:InitialRAMPercentage=50.0
        -XX:MaxMetaspaceSize=128m
        -XX:+ExitOnOutOfMemoryError
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/tmp/heapdump.hprof
      SPRING_APPLICATION_NAME: clinicadmin
      SPRING_DATA_MONGODB_URI: mongodb://clinicadmin_svc_user:${MONGO_APP_PASSWORD}@mongodb:27017/clinicadminservice?authSource=clinicadminservice&connectTimeoutMS=10000&socketTimeoutMS=30000&serverSelectionTimeoutMS=10000&maxPoolSize=20&minPoolSize=5
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_DEFAULT_CONNECTTIMEOUT: 10000
      SPRING_CLOUD_OPENFEIGN_CLIENT_CONFIG_DEFAULT_READTIMEOUT: 30000
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      WHATSAPP_BASE_URL: ${WHATSAPP_BASE_URL}
      WHATSAPP_AUTH_KEY: ${WHATSAPP_AUTH_KEY}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_SINGLE_USER_NOTIFICATION_TEMPLATE_ID: ${WHATSAPP_SINGLE_USER_NOTIFICATION_TEMPLATE_ID}

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s

    deploy:
      resources:
        limits:
          memory: 768m
        reservations:
          memory: 384m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
