version: '3.9'

services:

  mongodb:
    image: mongo:6.0
    container_name: mongodb_service
    restart: always
    stop_grace_period: 30s
    command: mongod --wiredTigerCacheSizeGB 0.25 --auth
    environment:
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/mongo_root_user
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
    secrets:
      - mongo_root_user
      - mongo_root_password
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka_service
    restart: always
    stop_grace_period: 30s
    stop_signal: SIGTERM
    ports:
      - "8761:8761"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 384m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

  apigateway:
    build:
      context: ./apigateway
      dockerfile: Dockerfile
    container_name: apigateway_service
    restart: always
    stop_grace_period: 30s
    stop_signal: SIGTERM
    ports:
      - "9090:9090"
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"
      SPRING_APPLICATION_NAME: apigateway
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_CLOUD_GATEWAY_HTTPCLIENT_CONNECT_TIMEOUT: 30000
      SPRING_CLOUD_GATEWAY_HTTPCLIENT_RESPONSE_TIMEOUT: 60s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/actuator/health"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
